# electron-builder configuration — كوكي بارك (Malahy)
# NSIS x64 installer + GitHub auto-update publishing.
appId: com.malahy.fathallah
productName: كوكي بارك
artifactName: malahy-setup-${version}.${ext}
directories:
  output: dist
files:
  - main.js
  - preload.js
  - database.js
  - activation.js
  - update-gate.js
  - users.js
  - permissions.js
  - perm-gate.js
  - login.js
  - accounts.js
  - recovery.js
  - index.html
  - windows/**/*
  - assets/**/*
  - package.json
  - "!backup/**"
  - "!dist/**"
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icons/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: كوكي بارك
  # حماية إلغاء التثبيت: قبل حذف أي ملف يُشغّل المزيل التطبيق مع --uninstall-auth
  # ليتحقق من الرقم السري لحساب المسؤول بنفس آلية تسجيل الدخول. لا يوجد أي سر
  # مضمّن في المزيل — التحقق كله يتم في التطبيق ضد تجزئة حساب المدير القائمة.
  # الاستثناء الوحيد المقصود هو مسار التحديث التلقائي (--updated).
  include: build/uninstall-auth.nsh
  # إزالة كل بيانات البرنامج المحلية (التذاكر، المبيعات، المصروفات، المرتجعات،
  # الهدايا، المرتبات، الإعدادات، الحسابات، حالة التفعيل والنسخ الاحتياطية)
  # عند إلغاء التثبيت من ويندوز. المجلد الهدف هو مجلد بيانات المستخدم الخاص
  # بالبرنامج فقط (%APPDATA%\malahy) ولا يُمس المجلد الأب المشترك ولا أي
  # ملفات أخرى. ملاحظة: لا يحدث هذا أثناء تحديث النسخة (isUpdated) حتى لا
  # تُمس البيانات عند التحديث التلقائي.
  deleteAppDataOnUninstall: true
publish:
  - provider: github
    owner: sliveamer20
    repo: malahy
