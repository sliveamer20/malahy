<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Loading...</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Tahoma,sans-serif;
}

body{

background:#181126;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

overflow:hidden;

}

.card{

width:520px;

height:320px;

background:#251A3C;

border-radius:20px;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

box-shadow:0 0 35px rgba(0,0,0,.45);

}

img{

width:120px;

margin-bottom:15px;

}

h1{

color:white;

font-size:30px;

margin-bottom:10px;

}

p{

color:#b7b7b7;

margin-bottom:25px;

}

.bar{

width:300px;

height:8px;

background:#3c3258;

border-radius:50px;

overflow:hidden;

}

.fill{

width:0;

height:100%;

background:#8A5BFF;

animation:load 2s linear forwards;

}

.version{

margin-top:25px;

color:#7c7c7c;

font-size:13px;

}

@keyframes load{

from{width:0;}

to{width:100%;}

}

</style>

</head>

<body>

<div class="card">

<img src="../assets/images/logo.png">

<h1>مدينة الألعاب فتح الله</h1>

<p>جارى تشغيل النظام...</p>

<div class="bar">

<div class="fill"></div>

</div>

<div class="version">

Version 2.0

</div>

</div>

</body>

</html>
