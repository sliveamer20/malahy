<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Loading...</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Design System Tokens — must match index.html :root exactly ===== */
:root{
  --bg:#0a1628;
  --bg-2:#060d18;
  --panel:#0f2137;
  --panel-2:#152a46;
  --line:rgba(255,255,255,.08);
  --line-soft:rgba(255,255,255,.05);
  --ink:#f1f5f9;
  --muted:#94a3b8;
  --muted-2:#64748b;
  --primary:#06b6d4;
  --primary-dim:#0891b2;
  --primary-bright:#22d3ee;
  --secondary:#f59e0b;
  --secondary-dim:#d97706;
  --success:#22c55e;
  --success-dim:#16a34a;
  --success-bright:#4ade80;
  --danger:#ef4444;
  --danger-dim:#dc2626;
  --danger-bright:#f87171;
  --radius:16px;
  --radius-sm:11px;
  --shadow:0 18px 40px -18px rgba(0,0,0,.8);
  --shadow-sm:0 8px 20px -10px rgba(0,0,0,.7);
  --glow-primary:0 0 0 3px rgba(6,182,212,.25);
  --glow-secondary:0 0 0 3px rgba(245,158,11,.25);
  --glow-success:0 0 0 3px rgba(34,197,94,.25);
  --focus-ring:var(--glow-primary);
  --ui:'Cairo','Tajawal','Segoe UI',Tahoma,sans-serif;
  --led:'Orbitron','Share Tech Mono',ui-monospace,'Courier New',monospace;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;}
::selection{background:rgba(6,182,212,.35);color:#fff;}

/* ---- Full-window root: vertically & horizontally centered ---- */
html,body{
  background:
    radial-gradient(ellipse 700px 350px at 50% 50%,rgba(6,182,212,.06),transparent 65%),
    var(--bg);
  height:100vh;min-height:100vh;
  overflow:hidden;
  display:flex;align-items:center;align-content:center;justify-content:center;
  animation:fadeIn .5s ease forwards;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

/* ---- Content group: one flex column ---- */
.content{
  display:flex;flex-direction:column;align-items:center;
  text-align:center;
  animation:contentIn .6s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes contentIn{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:translateY(0);}
}

/* ---- Logo: transparent PNG, subtle drop shadow, no container ---- */
.logo{
  width:180px;height:180px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:0;
  filter:drop-shadow(0 0 10px rgba(6,182,212,.18));
  animation:logoIn .8s ease forwards;
  animation-delay:.12s;opacity:0;
}
@keyframes logoIn{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:scale(1);}}

.logo img{
  width:100%;height:100%;object-fit:contain;display:block;
}

/* ---- Typography ---- */
h1{
  color:var(--ink);
  font-size:30px;font-weight:900;
  margin:12px 0 0 0;line-height:1;
  letter-spacing:-.4px;
  font-family:var(--ui);
  animation:txtIn .6s ease forwards;
  animation-delay:.22s;opacity:0;
}
@keyframes txtIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.sub{
  color:var(--muted-2);
  font-size:12.5px;font-weight:600;
  margin:8px 0 0 0;line-height:1;
  font-family:var(--ui);
  letter-spacing:.3px;
  animation:txtIn .6s ease forwards;
  animation-delay:.28s;opacity:0;
}

/* loading bar: 28px gap from subtitle */
.bar-wrap{margin-top:28px;}

/* status: 10px gap from loading bar */
.status{margin-top:10px;}

/* ---- Loading bar: full width within content column ---- */
.bar-wrap{
  width:100%;
  max-width:340px;
  animation:txtIn .6s ease forwards;
  animation-delay:.34s;opacity:0;
}
.bar{
  width:100%;height:5px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line-soft);
  border-radius:50px;
  overflow:hidden;
}
.fill{
  width:0;height:100%;border-radius:50px;
  background:linear-gradient(90deg,var(--primary-dim),var(--primary));
  animation:load 2s ease-in-out forwards;
  position:relative;
}
/* glossy sheen */
.fill::after{
  content:"";position:absolute;top:0;right:0;
  width:48px;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35));
  opacity:.5;border-radius:50px;
  filter:blur(2px);
}
@keyframes load{
  0%{width:0;}
  65%{width:82%;}
  82%{width:94%;}
  100%{width:100%;}
}

.status{
  margin:10px 0 0 0;line-height:1;
  font-size:11.5px;color:var(--muted-2);
  font-weight:600;font-family:var(--ui);
  letter-spacing:.3px;
  animation:txtIn .6s ease forwards;
  animation-delay:.34s;opacity:0;
}

.version{
  margin:0;line-height:1;
  font-size:11px;color:var(--muted-2);
  font-family:var(--ui);
  letter-spacing:.5px;
  animation:txtIn .6s ease forwards;
  animation-delay:.42s;opacity:0;
}
.version span{
  color:var(--secondary);
  font-family:var(--led);
  letter-spacing:1px;
}
</style>
</head>
<body>
<div class="content">
  <div class="logo"><img src="../assets/images/logo.png" alt=""></div>
  <h1>كوكي بارك</h1>
  <div class="sub">نظام إدارة الألعاب والمبيعات</div>
  <div class="bar-wrap">
    <div class="bar"><div class="fill"></div></div>
  </div>
  <div class="status">جارى التحميل...</div>
  <div class="version">الإصدار <span>2.4.9</span></div>
</div>
</body>
</html>
